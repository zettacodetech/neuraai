<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <link rel="manifest" href="/static/manifest.json" />
  <title>Profil — InomjonAI</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .auth-page { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 18px; position: relative; z-index: 1; }
    .auth-card { width: 100%; max-width: 560px; border-radius: 24px; padding: 30px 26px;
      animation: modal-pop 0.5s cubic-bezier(0.22, 1.61, 0.36, 1); }
    .auth-logo { width: 62px; height: 62px; border-radius: 20px; margin: 0 auto 14px; overflow: hidden;
      display: grid; place-items: center; box-shadow: 0 14px 40px rgba(109,92,255,0.5);
      animation: float 5s ease-in-out infinite; }
    .auth-logo img { width: 100%; height: 100%; object-fit: cover; }
    .auth-card h1 { text-align: center; margin: 0 0 6px; font-size: 1.6rem; font-weight: 800; }
    .auth-sub { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 0.92rem; line-height: 1.5; }
    .auth-err { display: none; background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.35);
      color: #fca5a5; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
    .auth-ok { display: none; background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.35);
      color: #6ee7b7; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
    .auth-home { display: flex; justify-content: center; margin-top: 16px; font-size: 0.85rem; gap: 18px; }
    .auth-home a { color: var(--muted); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
    .auth-home a:hover { color: var(--text); }
    .auth-submit { width: 100%; padding: 14px; border-radius: 14px; font-size: 1rem; font-weight: 700;
      background: var(--grad); color: #fff; border: none; cursor: pointer; transition: transform 0.2s; }
    .auth-submit:hover { transform: translateY(-2px); }
    .auth-submit:active { transform: scale(0.97); }
    .auth-submit:disabled { opacity: 0.6; transform: none; }
    .ghost-danger { width: 100%; padding: 13px; border-radius: 13px; font-weight: 600; margin-top: 10px;
      border: 1px solid rgba(248,113,113,0.35); color: #f87171; background: rgba(248,113,113,0.07); cursor: pointer; }
    .ghost-danger:hover { background: rgba(248,113,113,0.15); }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 16px; }
    .stat-cell { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 13px; text-align: center; }
    .stat-cell b { display: block; font-size: 1.5rem; background: var(--grad); -webkit-background-clip: text;
      background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-cell span { color: var(--muted); font-size: 0.76rem; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); padding: 8px 2px; font-size: 0.88rem; color: var(--text); }
    .stat-row small { color: var(--muted); }
    .bar { height: 6px; border-radius: 999px; background: var(--panel2); overflow: hidden; flex: 1; max-width: 120px; }
    .bar i { display: block; height: 100%; background: var(--grad); border-radius: 999px; }
    .profile-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 14px;
      color: var(--muted); font-size: 0.8rem; font-weight: 600; }
    .profile-divider::before, .profile-divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border)); }
    .profile-divider::after { background: linear-gradient(90deg, var(--border), transparent); }
    .tg-bind-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #2AABEE; color: #fff; font-weight: 700; font-size: 0.95rem;
      padding: 13px; border-radius: 14px; transition: transform 0.2s, filter 0.2s;
    }
    .tg-bind-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .tg-bind-btn:disabled { opacity: 0.6; transform: none; }
    .tg-bind-btn.unbound { background: transparent; color: var(--muted); border: 1px solid rgba(248,113,113,0.35); }
    .tg-bind-btn.unbound:hover { background: rgba(248,113,113,0.12); color: #fca5a5; filter: none; }
    .tg-bind-status { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: rgba(42,171,238,0.1); border: 1px solid rgba(42,171,238,0.3); border-radius: 13px;
      padding: 12px 14px; font-size: 0.88rem; margin-bottom: 10px; }
    .tg-bind-status small { color: var(--muted); }
    @media (max-width: 520px) { .stat-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <span class="grid-line"></span>
    <canvas id="neuralNet"></canvas>
    <div class="particles">
      <span style="--x:12%;--d:0s;--s:5px;--c:#7dd3fc"></span>
      <span style="--x:30%;--d:4s;--s:4px;--c:#c4b5fd"></span>
      <span style="--x:55%;--d:8s;--s:6px;--c:#67e8f9"></span>
      <span style="--x:75%;--d:2s;--s:3px;--c:#f0abfc"></span>
      <span style="--x:90%;--d:6s;--s:5px;--c:#7dd3fc"></span>
    </div>
  </div>
  <main class="auth-page">
    <div class="auth-card glass">
      <div class="auth-logo"><img src="/static/icons/logo.png" alt="InomjonAI" /></div>
      <h1>Profil</h1>
      <p class="auth-sub" id="profileSub">...</p>

      <div class="auth-err" id="profileErr"></div>
      <div class="auth-ok" id="profileOk"></div>

      <form id="profileForm" novalidate>
        <div class="profile-divider">👤 Shaxsiy ma'lumotlar</div>
        <div class="profile-grid block">
          <div class="field"><label for="pName">Ism</label>
            <input id="pName" type="text" placeholder="Ismingiz" maxlength="40" /></div>
          <div class="field"><label for="pSurname">Familiya</label>
            <input id="pSurname" type="text" placeholder="Familiya" maxlength="40" /></div>
        </div>
        <div class="field"><label for="pEmail">Email</label>
          <input id="pEmail" type="email" disabled placeholder="ism@mail.com" /></div>
        <div class="field"><label for="pPhone">Telefon</label>
          <input id="pPhone" type="tel" placeholder="+998 90 123 45 67" maxlength="30" /></div>
        <button class="auth-submit" id="profileSave" type="submit">Saqlash</button>
      </form>

      <div class="profile-divider">📊 Statistikangiz</div>
      <div class="stat-grid" id="statsGrid">
        <div class="stat-cell"><b>–</b><span>Xabarlar</span></div>
        <div class="stat-cell"><b>–</b><span>Suhbatlar</span></div>
        <div class="stat-cell"><b>–</b><span>Baholangan</span></div>
      </div>
      <div id="statsDetail"></div>

      <div class="profile-divider">🤖 Telegram bog'lash</div>
      <div class="tg-bind-status" id="tgBindStatus" hidden></div>
      <button class="tg-bind-btn" id="tgBindBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11.94 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.8 6.9-1.6 7.6c-.12.55-.44.68-.9.42l-2.47-1.82-1.19 1.15c-.13.13-.25.25-.5.25l.18-2.53 4.6-4.16c.2-.18-.04-.28-.31-.1l-5.69 3.58-2.45-.77c-.53-.17-.54-.53.11-.78l9.56-3.69c.44-.16.83.1.69.85z"/></svg>
        <span id="tgBindLabel">Telegram hisobini bog'lash</span>
      </button>

      <div class="profile-divider">🔒 Parolni o'zgartirish</div>
      <form id="passForm" novalidate>
        <div class="field"><label for="pOldPass">Eski parol</label>
          <input id="pOldPass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
        <div class="field"><label for="pNewPass">Yangi parol</label>
          <input id="pNewPass" type="password" placeholder="Kamida 4 belgi" autocomplete="new-password"/></div>
        <button class="ghost-btn" id="passSave" type="submit" style="width:100%">Parolni yangilash</button>
      </form>

      <button class="ghost-danger" id="profileLogout">Chiqish</button>
      <div class="auth-home">
        <a href="/">← Chatga qaytish</a>
        <a href="/api-key">🔑 API kalit</a>
      </div>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("neura_token");
    const CLIENT_ID = localStorage.getItem("neura_uid") || "guest";

    function showOk(el, txt) { el.textContent = txt; el.style.display = "block"; }
    function showErr(el, txt) { el.textContent = txt; el.style.display = "block"; }

    async function apiFetch(tpath, opts) {
      const res = await fetch(tpath, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || "xato"), { status: res.status });
      return data;
    }

    if (!token) { location.href = "/login"; }
    else {
      const profileErr = document.getElementById("profileErr");
      const profileOk = document.getElementById("profileOk");

      /* ================= Telegram bog'lash ================= */
      const tgBtn = document.getElementById("tgBindBtn");
      const tgLabel = document.getElementById("tgBindLabel");
      const tgStatus = document.getElementById("tgBindStatus");
      let tgLinked = null;

      function renderTgBind() {
        if (tgLinked) {
          tgStatus.hidden = false;
          tgStatus.innerHTML = "✅ Telegram bog'langan: <b>ID " + tgLinked + "</b><small>@InomjonAI_UzBot orqali avtomatik kira olasiz</small>";
          tgBtn.classList.add("unbound");
          tgLabel.textContent = "Bog'lashni bekor qilish";
        } else {
          tgStatus.hidden = true;
          tgBtn.classList.remove("unbound");
          tgLabel.textContent = "Telegram hisobini bog'lash";
        }
      }

      tgBtn.onclick = async () => {
        if (tgLinked) {
          try {
            await apiFetch("/api/tg-unbind", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token }),
            });
            tgLinked = null;
            renderTgBind();
            showOk(profileOk, "Telegram bog'lash bekor qilindi");
          } catch (ex) { showErr(profileErr, ex.message); }
          return;
        }
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
          tgBtn.disabled = true;
          tgLabel.textContent = "Bog'lanmoqda...";
          try {
            await apiFetch("/api/tg-bind", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, initData: window.Telegram.WebApp.initData }),
            });
            tgLinked = window.Telegram.WebApp.initDataUnsafe.user.id;
            renderTgBind();
            showOk(profileOk, "Telegram muvaffaqiyatli bog'landi!");
          } catch (ex) { showErr(profileErr, ex.message); }
          tgBtn.disabled = false;
          renderTgBind();
        } else {
          showErr(profileErr, "Bu tugma Telegram ilovasi ichida ishlaydi. Bot orqali oching: @InomjonAI_UzBot");
        }
      };

      apiFetch("/api/me?token=" + encodeURIComponent(token)).then(async (u) => {
        document.getElementById("profileSub").textContent = "@" + u.username;
        document.getElementById("pName").value = u.name || u.username || "";
        document.getElementById("pSurname").value = u.surname || "";
        document.getElementById("pEmail").value = u.email || "";
        document.getElementById("pPhone").value = u.phone || "";
        localStorage.setItem("neura_user", JSON.stringify(u));
        tgLinked = u.telegram_id || null;
        renderTgBind();
        try {
          const st = await apiFetch("/api/stats?token=" + encodeURIComponent(token));
          document.querySelector("#statsGrid .stat-cell:nth-child(1) b").textContent = st.messages;
          document.querySelector("#statsGrid .stat-cell:nth-child(2) b").textContent = st.conversations;
          document.querySelector("#statsGrid .stat-cell:nth-child(3) b").textContent = st.rated;
          const srcLabels = { intent: "Tezkor", code: "Kod", knowledge: "Bilim", websearch: "Internet", llm: "AI", fallback: "Zaxira", generation: "Generatsiya", vision: "Rasm" };
          let detail = '<div style="margin-top:8px">' + (st.by_source || []).map((s) => {
            const label = srcLabels[s.source] || s.source;
            const max = Math.max(1, ...(st.by_source || []).map((x) => x.n));
            return '<div class="stat-row"><small style="width:70px">' + label + '</small>' +
              '<div class="bar"><i style="width:' + Math.round((s.n / max) * 100) + '%"></i></div>' +
              '<b style="font-size:0.85rem">' + s.n + '</b></div>';
          }).join("") + '</div>';
          document.getElementById("statsDetail").innerHTML = detail;
        } catch (e) {}
      }).catch(() => { location.href = "/login"; });

      document.getElementById("profileForm").onsubmit = async (e) => {
        e.preventDefault();
        showOk(profileOk, ""); showOk(profileErr, "");
        profileOk.style.display = "none"; profileErr.style.display = "none";
        const save = document.getElementById("profileSave");
        save.disabled = true;
        try {
          const data = await apiFetch("/api/profile", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token,
              name: document.getElementById("pName").value.trim(),
              surname: document.getElementById("pSurname").value.trim(),
              phone: document.getElementById("pPhone").value.trim(),
            }),
          });
          localStorage.setItem("neura_user", JSON.stringify(data));
          showOk(profileOk, "✅ Ma'lumotlar saqlandi");
        } catch (ex) { showErr(profileErr, ex.message); }
        save.disabled = false;
      };

      document.getElementById("passForm").onsubmit = async (e) => {
        e.preventDefault();
        profileOk.style.display = "none"; profileErr.style.display = "none";
        const oldP = document.getElementById("pOldPass").value;
        const newP = document.getElementById("pNewPass").value;
        if (newP.length < 4) { showErr(profileErr, "Yangi parol kamida 4 belgidan iborat bo'lsin"); return; }
        const save = document.getElementById("passSave");
        save.disabled = true;
        try {
          await apiFetch("/api/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, old_password: oldP, new_password: newP }),
          });
          document.getElementById("pOldPass").value = "";
          document.getElementById("pNewPass").value = "";
          showOk(profileOk, "✅ Parol o'zgartirildi");
        } catch (ex) { showErr(profileErr, ex.message); }
        save.disabled = false;
      };

      document.getElementById("profileLogout").onclick = async () => {
        await fetch("/api/logout?token=" + encodeURIComponent(token)).catch(() => {});
        localStorage.removeItem("neura_token");
        localStorage.removeItem("neura_user");
        location.href = "/login";
      };
    }
  </script>
</body>
</html>
