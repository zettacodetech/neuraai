<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <link rel="manifest" href="/static/manifest.json" />
  <title>Kirish — InomjonAI</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .auth-page {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 18px; position: relative; z-index: 1;
    }
    .auth-card {
      width: 100%; max-width: 400px; border-radius: 24px; padding: 30px 26px;
      animation: modal-pop 0.5s cubic-bezier(0.22, 1.61, 0.36, 1);
    }
    .auth-logo { width: 62px; height: 62px; border-radius: 20px; margin: 0 auto 14px; overflow: hidden;
      display: grid; place-items: center; box-shadow: 0 14px 40px rgba(109,92,255,0.5);
      animation: float 5s ease-in-out infinite; }
    .auth-logo img { width: 100%; height: 100%; object-fit: cover; }
    .auth-card h1 { text-align: center; margin: 0 0 6px; font-size: 1.6rem; font-weight: 800; }
    .auth-sub { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 0.92rem; line-height: 1.5; }
    .auth-err { display: none; background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.35);
      color: #fca5a5; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
    .auth-ok { display: none; background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.35);
      color: #6ee7b7; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
    .auth-switch { text-align: center; margin-top: 18px; font-size: 0.88rem; color: var(--muted); }
    .auth-switch a { color: var(--violet2); font-weight: 600; text-decoration: none; }
    .auth-switch a:hover { text-decoration: underline; }
    .auth-home { display: flex; justify-content: center; margin-top: 14px; font-size: 0.85rem; }
    .auth-home a { color: var(--muted); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
    .auth-home a:hover { color: var(--text); }
    .auth-submit { width: 100%; padding: 14px; border-radius: 14px; font-size: 1rem; font-weight: 700;
      background: var(--grad); color: #fff; border: none; cursor: pointer;
      transition: transform 0.2s; }
    .auth-submit:hover { transform: translateY(-2px); }
    .auth-submit:active { transform: scale(0.97); }
    .auth-submit:disabled { opacity: 0.6; transform: none; }
    .tg-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: var(--muted); font-size: 0.8rem; }
    .tg-divider::before, .tg-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .tg-login-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #2AABEE; color: #fff; font-weight: 700; font-size: 0.98rem;
      padding: 13px; border-radius: 14px; transition: transform 0.2s, filter 0.2s;
    }
    .tg-login-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .tg-login-btn:disabled { opacity: 0.6; transform: none; }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <span class="grid-line"></span>
    <canvas id="neuralNet"></canvas>
    <div class="particles">
      <span style="--x:12%;--d:0s;--s:5px;--c:#7dd3fc"></span>
      <span style="--x:30%;--d:4s;--s:4px;--c:#c4b5fd"></span>
      <span style="--x:55%;--d:8s;--s:6px;--c:#67e8f9"></span>
      <span style="--x:75%;--d:2s;--s:3px;--c:#f0abfc"></span>
      <span style="--x:90%;--d:6s;--s:5px;--c:#7dd3fc"></span>
    </div>
  </div>
  <main class="auth-page">
    <div class="auth-card glass">
      <div class="auth-logo"><img src="/static/icons/logo.png" alt="InomjonAI" /></div>
      <h1>Xush kelibsiz!</h1>
      <p class="auth-sub">Hisobingizga kirib suhbatni davom ettiring</p>
      <div class="auth-err" id="authErr"></div>
      <div class="auth-ok" id="authOk"></div>
      <form id="authForm" novalidate>
        <div class="field">
          <label for="fEmail">Email</label>
          <input id="fEmail" type="email" placeholder="ism@mail.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="fPassword">Parol</label>
          <input id="fPassword" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div class="field" id="faBox" style="display:none">
          <label for="fCode">2FA kod (Google Authenticator)</label>
          <input id="fCode" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" autofocus />
        </div>
        <button class="auth-submit" id="authSubmit" type="submit">Kirish</button>
      </form>
      <div class="tg-divider"><span>yoki</span></div>
      <button class="tg-login-btn" id="tgLoginBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.94 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.8 6.9-1.6 7.6c-.12.55-.44.68-.9.42l-2.47-1.82-1.19 1.15c-.13.13-.25.25-.5.25l.18-2.53 4.6-4.16c.2-.18-.04-.28-.31-.1l-5.69 3.58-2.45-.77c-.53-.17-.54-.53.11-.78l9.56-3.69c.44-.16.83.1.69.85z"/></svg>
        Telegram orqali kirish
      </button>
      <div class="auth-switch">
        Hisobingiz yo'qmi? <a href="/register">Ro'yxatdan o'ting</a>
      </div>
      <div class="auth-home"><a href="/">← Bosh sahifaga qaytish</a></div>
    </div>
  </main>

  <script>
    let CLIENT_ID = localStorage.getItem("neura_uid");
    if (!CLIENT_ID) {
      CLIENT_ID = "u" + Date.now() + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("neura_uid", CLIENT_ID);
    }

    /* ================= Telegram orqali kirish ================= */
    const tgBtn = document.getElementById("tgLoginBtn");
    const err = document.getElementById("authErr");
    const ok2 = document.getElementById("authOk");

    function tgLoginWithInitData(initData) {
      tgBtn.disabled = true;
      tgBtn.textContent = "Kirilmoqda...";
      fetch("/api/tg-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData }),
      })
        .then((res) => res.json().then((d) => ({ ok: res.ok, d })))
        .then(({ ok, d }) => {
          if (!ok) throw new Error(d.error || "xato");
          localStorage.setItem("neura_token", d.token);
          cacheUser({ username: d.user.name || "tg_user", name: d.user.name || "Telegram foydalanuvchisi" });
          ok2.textContent = "Telegram orqali kirdingiz!";
          ok2.style.display = "block";
          setTimeout(() => { location.href = "/"; }, 400);
        })
        .catch((e) => {
          err.textContent = e.message || "Xatolik yuz berdi.";
          err.style.display = "block";
          tgBtn.disabled = false;
          tgBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.94 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.8 6.9-1.6 7.6c-.12.55-.44.68-.9.42l-2.47-1.82-1.19 1.15c-.13.13-.25.25-.5.25l.18-2.53 4.6-4.16c.2-.18-.04-.28-.31-.1l-5.69 3.58-2.45-.77c-.53-.17-.54-.53.11-.78l9.56-3.69c.44-.16.83.1.69.85z"/></svg> Telegram orqali kirish';
        });
    }

    tgBtn.onclick = () => {
      if (window.Telegram && window.Telegram.WebApp) {
        const w = window.Telegram.WebApp;
        if (w.initData) { tgLoginWithInitData(w.initData); return; }
      }
      err.textContent = "Bu tugma Telegram ilovasi ichida ishlaydi. Bot orqali oching: @InomjonAI_UzBot";
      err.style.display = "block";
    };

    const form = document.getElementById("authForm");
    const ok = document.getElementById("authOk");
    const btn = document.getElementById("authSubmit");
    let pend2fa = null;

    function cacheUser(u) {
      try { localStorage.setItem("neura_user", JSON.stringify(u)); } catch (e) {}
    }

    function show2fa(userId) {
      pend2fa = userId;
      document.getElementById("faBox").style.display = "block";
      document.getElementById("fPassword").parentElement.style.display = "none";
      btn.textContent = "Kodni tasdiqlash";
      document.getElementById("fCode").focus();
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      err.style.display = "none";
      ok.style.display = "none";
      const email = document.getElementById("fEmail").value.trim().toLowerCase();
      const password = document.getElementById("fPassword").value;
      if (!email.includes("@")) { err.textContent = "To'g'ri email kiriting (masalan: ism@mail.com)"; err.style.display = "block"; return; }
      if (!pend2fa && password.length < 4) { err.textContent = "Parol kamida 4 ta belgidan iborat bo'lsin"; err.style.display = "block"; return; }
      btn.disabled = true;
      btn.textContent = "Kirilmoqda...";
      try {
        let data;
        if (pend2fa) {
          const code = document.getElementById("fCode").value.trim();
          if (code.length !== 6) { err.textContent = "6 xonali kodni kiriting"; err.style.display = "block"; btn.disabled = false; btn.textContent = "Kodni tasdiqlash"; return; }
          const r2 = await fetch("/api/login/2fa", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: pend2fa, code }),
          });
          data = await r2.json();
          if (!r2.ok) {
            throw new Error(data.error || "xato");
          }
          pend2fa = null;
        } else {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password, client_id: CLIENT_ID }),
          });
          data = await res.json();
          if (res.status === 202 && data.twofa_required) {
            show2fa(data.user_id || 0);
            btn.disabled = false;
            return;
          }
          if (!res.ok) throw new Error(data.error || "xato");
        }
        localStorage.setItem("neura_token", data.token);
        cacheUser({ username: data.username, name: data.name, surname: data.surname || "", email: data.email || "", phone: data.phone || "" });
        ok.textContent = "Muvaffaqiyatli kirdingiz!";
        ok.style.display = "block";
        setTimeout(() => { location.href = "/"; }, 350);
      } catch (ex) {
        err.textContent = ex.message || "Xatolik yuz berdi. Qayta urinib ko'ring.";
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = pend2fa ? "Kodni tasdiqlash" : "Kirish";
      }
    };
  </script>
</body>
</html>
